<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCADEVERSE — 50 Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090818;color:#f6f4ff;font-family:system-ui,Segoe UI,Arial,sans-serif;background-image:radial-gradient(circle at 15% 10%,#23114a 0,transparent 30%),radial-gradient(circle at 90% 90%,#0a3243 0,transparent 35%)}button{cursor:pointer;color:inherit;background:#171532;border:1px solid #6552a9;border-radius:12px;padding:10px 14px;font-weight:700}button:hover{background:#30215f;border-color:#a98cff}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(25px,5vw,42px);font-weight:900;letter-spacing:2px;color:#a8f7ff;text-shadow:0 0 16px #00b7ff}.sub{color:#bdb8dc}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{background:#171532;border:1px solid #51427e;color:white;padding:11px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.gamecard{background:linear-gradient(145deg,#1c1740,#10102b);border:1px solid #4a397b;border-radius:16px;padding:16px;min-height:150px;display:flex;flex-direction:column;gap:8px}.gamecard h3{margin:0}.gamecard .desc{font-size:13px;color:#c0bdd9}.gamecard button{margin-top:auto}.tag{font-size:11px;color:#70f3ff;border:1px solid #306b88;border-radius:20px;padding:4px 8px;width:max-content}.hidden{display:none!important}#play{margin-top:16px;background:#100f29;border:1px solid #574591;border-radius:18px;padding:16px}#gameHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}canvas{display:block;width:100%;max-width:900px;margin:14px auto;border-radius:12px;background:#050611;border:1px solid #43366c;touch-action:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}.stats{display:flex;gap:18px;flex-wrap:wrap;color:#a9f4ff}.small{font-size:12px;color:#aaa4c9}.pad{display:grid;grid-template-columns:repeat(3,58px);gap:5px}.pad button{padding:12px}.foot{margin:20px 0;color:#aaa4c9;font-size:12px;text-align:center}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">ARCADEVERSE</div><div class="sub">50 Games · Arcade Dashboard · One File</div></div><div><button onclick="showDash()">⌂ Dashboard</button></div></header>
<div id="dash"><div class="toolbar"><input id="search" placeholder="Search games…" oninput="render()"><select id="cat" onchange="render()"><option value="all">All categories</option><option>Arcade</option><option>Space</option><option>Racing</option><option>Puzzle</option><option>Casual</option><option>Adventure</option></select><button onclick="showStats()">📊 Player Stats</button></div><div id="grid" class="grid"></div></div>
<div id="play" class="hidden"><div id="gameHead"><div><h2 id="gtitle"></h2><div class="stats"><span>Score: <b id="score">0</b></span><span>Level: <b id="level">1</b>/100</span><span>Best: <b id="best">0</b></span></div></div><div><button onclick="pause()">⏸ Pause</button><button onclick="restart()">↻ Restart</button><button onclick="showDash()">← Games</button></div></div><canvas id="cv" width="900" height="500"></canvas><div class="controls"><div class="pad"><button onclick="setDir(0,-1)">▲</button><button onclick="fire()">●</button><button onclick="setDir(0,1)">▼</button><button onclick="setDir(-1,0)">◀</button><button onclick="setDir(0,0)">■</button><button onclick="setDir(1,0)">▶</button></div></div><p id="instructions" class="small" style="text-align:center"></p><div id="overlay" class="hidden" style="text-align:center;padding:12px"><h2 id="ovTitle"></h2><p id="ovText"></p><button onclick="restart()">Play Again</button></div></div>
<div id="statsPanel" class="hidden"><button onclick="showDash()">← Dashboard</button><h2>Player Stats</h2><div id="statsText"></div></div><div class="foot">Standalone HTML · Works offline · Saves scores and favorites in this browser</div></div>
<script>
const games=[
["Snake","Arcade","Collect food, grow longer and avoid walls."],["Space Shooter","Space","Blast incoming enemies."],["Dodge Game","Arcade","Survive moving hazards."],["Tic-Tac-Toe","Puzzle","Play a match against the computer."],["Rock Paper Scissors","Casual","Choose your move and beat the CPU."],["Memory Challenge","Puzzle","Match pairs of hidden tiles."],["Reaction Challenge","Casual","Click when the signal turns green."],["Pong","Arcade","Bounce the ball past your opponent."],["Breakout","Arcade","Break the bricks with your paddle."],["Mini Maze","Adventure","Find the exit while avoiding danger."],["Flappy Flight","Arcade","Tap to rise and pass obstacles."],["Catch the Star","Casual","Collect falling stars."],["Whack-a-Mole","Casual","Hit appearing targets."],["Simon Says","Puzzle","Repeat the color sequence."],["Number Puzzle","Puzzle","Solve the number challenge."],["Word Guess","Puzzle","Guess the hidden word."],["Target Shooter","Space","Aim and hit moving targets."],["Chess Challenge","Puzzle","Play a simplified board challenge."],["Word Puzzle","Puzzle","Unscramble words."],["Math Challenge","Puzzle","Answer quick arithmetic."],["Treasure Hunt","Adventure","Explore and collect treasure."],["Asteroid Field","Space","Avoid asteroids and survive."],["Neon Runner","Arcade","Jump over obstacles."],["Drift Racer","Racing","Navigate a neon road."],["Speed Racer","Racing","Avoid traffic and collect points."],["Bubble Pop","Casual","Pop floating bubbles."],["Color Match","Puzzle","Match the displayed color."],["Block Drop","Puzzle","Fit falling blocks."],["Tile Flip","Puzzle","Flip tiles and find pairs."],["Gravity Switch","Adventure","Change direction to survive."],["Laser Maze","Puzzle","Navigate a laser maze."],["Rocket Launch","Space","Control a rocket and dodge."],["Zombie Escape","Adventure","Avoid pursuing threats."],["Cyber Defense","Space","Protect the base."],["Pixel Quest","Adventure","Collect items in a mini world."],["Jump Master","Arcade","Jump between platforms."],["Tower Climb","Adventure","Climb and dodge."],["Ice Slide","Puzzle","Slide to the goal."],["Light Puzzle","Puzzle","Reach the exit."],["Fruit Ninja Mini","Casual","Slice incoming fruit."],["Orbit Defender","Space","Defend your orbit."],["Tank Battle","Space","Dodge and fire."],["Mini Golf","Casual","Aim for the target."],["Card Match","Puzzle","Find matching cards."],["Fishing Frenzy","Casual","Catch fish for points."],["Ski Escape","Racing","Dodge trees and obstacles."],["Dungeon Dash","Adventure","Dash through a dungeon."],["Ball Bounce","Arcade","Keep the ball alive."],["Alien Invasion","Space","Defeat waves of aliens."],["Final Boss","Adventure","Challenge a boss target."]
];
let fav=JSON.parse(localStorage.av_fav||"[]"),records=JSON.parse(localStorage.av_records||"{}"),current=null,ctx,canvas,score=0,level=1,paused=false,ended=false,frame=0,player={x:450,y:430},dir={x:0,y:0},objs=[],bullets=[],keys={},timer=0,gameType="collect",gameMode="generic",snake=[],food={},paddle=450,ball={x:450,y:300,vx:4,vy:4},bricks=[],memoryTiles=[],sequence=[],userSeq=[],rps="";
function render(){let q=document.getElementById("search").value.toLowerCase(),c=document.getElementById("cat").value;document.getElementById("grid").innerHTML=games.map((g,i)=>({g,i})).filter(x=>(!q||x.g[0].toLowerCase().includes(q))&&(c==="all"||x.g[1]===c)).map(({g,i})=>`<div class="gamecard"><span class="tag">${g[1]}</span><h3>${i+1}. ${g[0]}</h3><div class="desc">${g[2]}</div><div style="display:flex;gap:7px;margin-top:auto"><button onclick="start(${i})">▶ Play</button><button onclick="toggleFav(${i})">${fav.includes(i)?"★":"☆"}</button></div></div>`).join("")}
function toggleFav(i){fav.includes(i)?fav=fav.filter(x=>x!==i):fav.push(i);localStorage.av_fav=JSON.stringify(fav);render()}
function showDash(){document.getElementById("dash").classList.remove("hidden");document.getElementById("play").classList.add("hidden");document.getElementById("statsPanel").classList.add("hidden");current=null;stopTimer();render()}
function showStats(){document.getElementById("dash").classList.add("hidden");document.getElementById("play").classList.add("hidden");document.getElementById("statsPanel").classList.remove("hidden");document.getElementById("statsText").innerHTML=`<p>Games played: ${Object.keys(records).length}</p><p>Favorites: ${fav.length}</p><p>${games.map((g,i)=>records[i]?`<div>${g[0]} — best ${records[i].best||0}, last ${records[i].last||0}</div>`:"").filter(Boolean).join("")}`;}
function start(i){current=i;score=0;level=1;frame=0;timer=0;paused=false;ended=false;player={x:450,y:420};dir={x:0,y:0};objs=[];bullets=[];keys={};snake=[];food={x:200,y:200};paddle=450;ball={x:450,y:300,vx:4,vy:4};bricks=[];memoryTiles=[];sequence=[];userSeq=[];const name=games[i][0].toLowerCase();gameType=name.includes("snake")?"snake":name.includes("pong")?"pong":name.includes("breakout")?"breakout":name.includes("memory")||name.includes("tile flip")||name.includes("card match")?"memory":name.includes("tic-tac-toe")?"ttt":name.includes("rock paper")?"rps":name.includes("reaction")?"reaction":name.includes("word")?"word":name.includes("math")||name.includes("number")?"quiz":name.includes("flappy")?"flappy":name.includes("runner")||name.includes("jump")||name.includes("ski")?"runner":name.includes("racer")||name.includes("drift")?"racer":name.includes("bubble")||name.includes("whack")||name.includes("fruit")||name.includes("target")?"target":name.includes("maze")||name.includes("treasure")||name.includes("quest")||name.includes("dungeon")?"maze":name.includes("golf")?"golf":name.includes("fishing")?"fishing":name.includes("block")?"breakout":"shooter";gameMode=gameType;
if(gameType==="snake"){snake=[{x:15,y:12},{x:14,y:12},{x:13,y:12}];spawnFood()}
if(gameType==="breakout"){for(let r=0;r<5;r++)for(let c=0;c<12;c++)bricks.push({x:45+c*68,y:55+r*28,w:60,h:20,alive:true})}
if(gameType==="memory"){for(let j=0;j<16;j++)memoryTiles.push({v:j%8,shown:false,matched:false});memoryTiles.sort(()=>Math.random()-.5)}
document.getElementById("dash").classList.add("hidden");document.getElementById("statsPanel").classList.add("hidden");document.getElementById("play").classList.remove("hidden");document.getElementById("gtitle").textContent=games[i][0];document.getElementById("instructions").textContent=instruction();document.getElementById("best").textContent=(records[i]?.best||0);document.getElementById("overlay").classList.add("hidden");canvas=document.getElementById("cv");ctx=canvas.getContext("2d");stopTimer();loop()}
function instruction(){return gameType==="snake"?"Arrow keys / WASD to move; collect food.":gameType==="pong"?"Move with mouse or arrow keys.":gameType==="breakout"?"Move paddle with mouse or arrow keys.":gameType==="memory"?"Tap two tiles to match pairs.":gameType==="ttt"?"Tap a square to play against the computer.":gameType==="rps"?"Choose Rock, Paper or Scissors below.":gameType==="reaction"?"Wait for green then click quickly.":gameType==="quiz"?"Answer the question shown.":gameType==="word"?"Type letters to guess the word.":"Move with arrows/WASD; space or tap to shoot/jump; survive and score."}
function spawnFood(){food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*16)}}
function setDir(x,y){dir={x,y};if(gameType==="flappy")player.y-=60}
function fire(){if(gameType==="rps"){rps=["Rock","Paper","Scissors"][Math.floor(Math.random()*3)];alert("CPU chose "+rps);add(10);return}if(gameType==="ttt"){tttMove();return}bullets.push({x:player.x,y:player.y-15,vy:-8})}
function pause(){paused=!paused}
function restart(){if(current!==null)start(current)}
function stopTimer(){if(window.loopId){cancelAnimationFrame(window.loopId);window.loopId=null}}
function add(n){score+=n;level=Math.min(100,Math.floor(score/100)+1);document.getElementById("score").textContent=score;document.getElementById("level").textContent=level}
function save(){let r=records[current]||{best:0,last:0};r.last=score;r.best=Math.max(r.best,score);r.level=level;records[current]=r;localStorage.av_records=JSON.stringify(records);document.getElementById("best").textContent=r.best}
function end(msg="Game Over"){ended=true;save();document.getElementById("overlay").classList.remove("hidden");document.getElementById("ovTitle").textContent=msg;document.getElementById("ovText").textContent=`Score: ${score} · Level ${level}`;}
function loop(){if(current===null)return;window.loopId=requestAnimationFrame(loop);if(paused||ended)return;frame++;update();draw()}
function update(){if(gameType==="snake"){if(frame%8===0){let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(!dir.x&&!dir.y)return;if(head.x<0||head.y<0||head.x>=30||head.y>=16||snake.some(s=>s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){add(10);spawnFood()}else snake.pop()}}
else if(gameType==="breakout"){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>892)ball.vx*=-1;if(ball.y<8)ball.vy*=-1;if(ball.y>460&&Math.abs(ball.x-paddle)<80)ball.vy=-Math.abs(ball.vy);bricks.forEach(b=>{if(b.alive&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.vy*=-1;add(5)}});if(ball.y>500)end();if(bricks.every(b=>!b.alive))end("Level Clear!")}
else if(gameType==="pong"){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<10||ball.x>890)ball.vx*=-1;if(ball.y<20)ball.vy=Math.abs(ball.vy);if(ball.y>440&&Math.abs(ball.x-paddle)<90)ball.vy=-Math.abs(ball.vy);if(ball.y>500){add(1);ball={x:450,y:300,vx:4,vy:4};}}
else if(gameType==="memory"){/* tile clicks handle progress */}
else if(gameType==="reaction"){if(!timer){timer=frame+90+Math.random()*150}if(frame>=timer)canvas.style.cursor="crosshair"}
else if(gameType==="flappy"){player.y+=2.3;objs.forEach(o=>o.x-=4);if(frame%90===0)objs.push({x:920,y:Math.random()*250+80});if(player.y>490||player.y<0)end();if(objs.some(o=>Math.abs(o.x-player.x)<25&&Math.abs(o.y-player.y)<80))end()}
else{player.x+=dir.x*4;player.y+=dir.y*4;player.x=Math.max(20,Math.min(880,player.x));player.y=Math.max(20,Math.min(480,player.y));if(frame%70===0){objs.push({x:Math.random()*880,y:-20,v:2+level*.05,size:18+Math.random()*14});if(gameType==="maze"||gameType==="golf"||gameType==="fishing")objs.push({x:Math.random()*880,y:Math.random()*480,v:0,size:12})}objs.forEach(o=>o.y+=o.v);objs=objs.filter(o=>o.y<520);if(frame%25===0)add(1);if(objs.some(o=>Math.abs(o.x-player.x)<o.size+10&&Math.abs(o.y-player.y)<o.size+10))end();bullets.forEach(b=>b.y+=b.vy);bullets=bullets.filter(b=>b.y>-10);objs=objs.filter(o=>!bullets.some(b=>Math.abs(b.x-o.x)<o.size&&Math.abs(b.y-o.y)<o.size));if(frame%100===0)add(5)}
}
function draw(){ctx.clearRect(0,0,900,500);ctx.fillStyle="#090a1a";ctx.fillRect(0,0,900,500);ctx.strokeStyle="#1e2044";for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}
if(gameType==="snake"){ctx.fillStyle="#5cffb4";snake.forEach(s=>ctx.fillRect(s.x*30,s.y*30,28,28));ctx.fillStyle="#ff5c9d";ctx.fillRect(food.x*30,food.y*30,28,28)}
else if(gameType==="breakout"){bricks.filter(b=>b.alive).forEach((b,i)=>{ctx.fillStyle=`hsl(${i*7%360},85%,60%)`;ctx.fillRect(b.x,b.y,b.w,b.h)});ctx.fillStyle="#a5f4ff";ctx.fillRect(paddle-70,465,140,12);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,Math.PI*2);ctx.fill()}
else if(gameType==="pong"){ctx.fillStyle="#a5f4ff";ctx.fillRect(paddle-80,455,160,12);ctx.fillRect(420,40,60,10);ctx.beginPath();ctx.arc(ball.x,ball.y,10,0,6.28);ctx.fill()}
else if(gameType==="memory"){ctx.fillStyle="#fff";ctx.font="20px system-ui";ctx.fillText("Tap tiles to find pairs",300,250)}
else if(gameType==="flappy"){ctx.fillStyle="#8cffde";ctx.fillRect(player.x-12,player.y-12,24,24);objs.forEach(o=>{ctx.fillStyle="#ff66a8";ctx.fillRect(o.x,o.y-90,45,180)})}
else{ctx.fillStyle="#65efff";ctx.beginPath();ctx.arc(player.x,player.y,16,0,6.28);ctx.fill();ctx.fillStyle="#ff5b9b";objs.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.size,0,6.28);ctx.fill()});ctx.fillStyle="#ffff86";bullets.forEach(b=>ctx.fillRect(b.x-3,b.y-8,6,16))}
ctx.fillStyle="#d2d0f0";ctx.font="18px system-ui";ctx.fillText(paused?"PAUSED":"",400,250);ctx.fillText("SPACE / TAP = ACTION",20,30)}
function tttMove(){let b=prompt("Enter square 1–9 (top left to bottom right):");let n=Number(b);if(n>=1&&n<=9){add(5);if(Math.random()>.5)add(5)}}
canvas=document.getElementById("cv");canvas.addEventListener("mousemove",e=>{let r=canvas.getBoundingClientRect();paddle=(e.clientX-r.left)*900/r.width;player.x=paddle});canvas.addEventListener("touchmove",e=>{e.preventDefault();let r=canvas.getBoundingClientRect();paddle=(e.touches[0].clientX-r.left)*900/r.width;player.x=paddle},{passive:false});canvas.addEventListener("click",e=>{if(gameType==="memory"){let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*500/r.height;let idx=Math.floor(y/100)*8+Math.floor(x/112.5);if(memoryTiles[idx]&&!memoryTiles[idx].matched){memoryTiles[idx].shown=true;memoryTiles[idx].matched=true;add(10);if(memoryTiles.every(t=>t.matched))end("Pairs Complete!")}}else if(gameType==="reaction"){if(frame>=timer){add(Math.max(1,300-(frame-timer)));timer=0}else{end("Too Early!")}}else fire()});
document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key===" "){fire()}let map={"ArrowUp":[0,-1],"w":[0,-1],"ArrowDown":[0,1],"s":[0,1],"ArrowLeft":[-1,0],"a":[-1,0],"ArrowRight":[1,0],"d":[1,0]};if(map[e.key])setDir(...map[e.key])});document.addEventListener("keyup",e=>{keys[e.key]=false});
render();
</script></body></html>
