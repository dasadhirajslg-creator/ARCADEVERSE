
name: Build ARCADEVERSE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -d assets ]; then cp -r assets www/; fi
          if [ -f style.css ]; then cp style.css www/; fi
          if [ -f app.js ]; then cp app.js www/; fi
          if [ -f games.json ]; then cp games.json www/; fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init ARCADEVERSE com.arcadeverse.game --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCADEVERSE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
